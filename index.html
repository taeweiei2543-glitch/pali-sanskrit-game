<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ภารกิจพิชิตภาษา บาลี VS สันสกฤต</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1d2a5c;--bg2:#2a1d4d;--card:#2b2b52;--tx:#f3f1ff;--mut:#b9b6e6;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#1d2a5c;--bg2:#2a1d4d;--card:#2b2b52;--tx:#f3f1ff;--mut:#b9b6e6}
*{box-sizing:border-box}html,body{min-height:100%;margin:0}
body{font-family:'Kanit','Noto Sans Thai',Tahoma,sans-serif;color:var(--tx);background:var(--bg1) linear-gradient(var(--bg1),var(--bg2)) fixed}
#app{max-width:860px;margin:auto;padding:10px 12px 28px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:clamp(15px,3.6vw,22px);margin:0;flex:1 1 220px}
.pill{background:var(--card);border-radius:99px;padding:4px 12px;font-weight:700;box-shadow:0 3px 0 #0002}
.ib{border:0;background:var(--card);border-radius:50%;width:40px;height:40px;font-size:18px;box-shadow:0 3px 0 #0002;cursor:pointer}
.pg{height:12px;background:#fff6;border-radius:9px;margin:10px 0;overflow:hidden}
.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffc83d,#ff7a59);border-radius:9px;transition:width .5s}
.stage{display:flex;align-items:flex-end;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0}
.cw{text-align:center;width:clamp(84px,20vw,120px);font-size:12px}
.cw b{display:block;background:var(--card);border-radius:9px;padding:1px 4px}
.ch{width:100%;overflow:visible;filter:drop-shadow(0 6px 4px #0003);animation:bob 2.2s ease-in-out infinite}
.cw:nth-child(2) .ch{animation-delay:.4s}.cw:nth-child(3) .ch{animation-delay:.8s}
.ey{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}

.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 8px 0 #0002;margin-top:10px}
.c{text-align:center}.card h1,.card h2{margin:4px 0 8px}
.mut{color:var(--mut)}
.btn{font:inherit;font-weight:700;font-size:clamp(16px,4vw,20px);border:0;border-radius:18px;padding:14px 16px;cursor:pointer;color:#fff;box-shadow:0 6px 0 #0003;transition:transform .1s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #0003}
.pri{background:linear-gradient(#9b7bff,#6a3df0)}
.c0{background:linear-gradient(#4fc3f7,#0288d1)}.c1{background:linear-gradient(#ff8a65,#e64a19)}.c2{background:linear-gradient(#81c784,#388e3c)}.c3{background:linear-gradient(#ba68c8,#7b1fa2)}
.o.right{background:linear-gradient(#66e08a,#1faa59)!important}
.o.wrong{background:linear-gradient(#ffb74d,#f57c00)!important;opacity:.85}
.btn:disabled{cursor:default}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.q{font-size:clamp(20px,5vw,28px);font-weight:700;text-align:center;margin:10px 0 16px}
.w{font-size:clamp(44px,12vw,76px);color:var(--pri)}
.fb{margin-top:14px;padding:12px 14px;border-radius:16px;animation:pop .35s}
.fb.ok{background:#d9f8e4;color:#14532d}.fb.no{background:#fff0d9;color:#7a3b00}.fb p{margin:6px 0}.fb .btn{margin-top:6px;width:100%}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mg>div{display:grid;gap:10px;align-content:start}
.m{background:linear-gradient(#fff,#e8e4ff);color:#25254a;font-size:clamp(14px,3.6vw,18px)}
.m.sel{outline:4px solid var(--gold)}.m.right{background:linear-gradient(#66e08a,#1faa59);color:#fff}
.shake{animation:wob .4s}
.stars span{font-size:48px;display:inline-block;filter:grayscale(1) opacity(.35)}
.stars span.on{filter:none;animation:pop .6s both}
.big{font-size:64px}
.cw.hop{animation:hop .8s}.cw.wob{animation:wob .6s}
.cf{position:fixed;top:-30px;z-index:9;animation:fall 1.6s ease-in forwards;pointer-events:none}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-30px) scale(1.08)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ch,.ey{animation:none}}

function run(){const k=S.lv;if(k==1)return match();
const o=["บาลี","สันสกฤต"],tf=["จริง ✅","หลอก ❌"];
S.q=sh(k==0?L1.map(([q,a,e])=>({l:"คำนี้เป็นภาษาอะไร?",q:`<span class="w">${q}</span>`,o,a,e})):k==2?L3.map(([q,a,e])=>({l:"ข้อความนี้จริงหรือหลอก?",q,o:tf,a,e})):L4.map(([q,c,...r])=>{const e=r.pop(),op=sh([c,...r]);return{l:"ตอบคำถามบอส",q,o:op,a:op.indexOf(c),e}}));
S.i=0;S.ok=0;ask()}
function ask(){const k=S.lv,x=S.q[S.i],n=S.q.length;bar(S.i/n);
R(stage(LV[k].c,"คิดดี ๆ นะ!")+`<div class="card"><div class="mut">ข้อ ${S.i+1} / ${n}</div><h2>${x.l}</h2><div class="q">${x.q}</div><div class="opts">${x.o.map((t,j)=>`<button class="btn o c${k==3?j:j+(k==2?2:0)}" onclick="pick(${j})">${k==3?"กขคง"[j]+". ":""}${t}</button>`).join('')}</div><div id="fb"></div></div>`)}
function pick(j){const x=S.q[S.i],ok=j==x.a;
document.querySelectorAll('.o').forEach((b,i)=>{b.disabled=true;if(i==x.a)b.classList.add('right');else if(i==j)b.classList.add('wrong')});
if(ok){S.sc+=10;S.ok++;yay();fx();react('hop');say("เก่งมาก! 🎉")}else{oops();react('wob');say("ไม่เป็นไร เรียนรู้ไปด้วยกัน 💪")}
hud();$('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?"🎉 ถูกต้อง! +10 คะแนน":"💡 ไม่เป็นไรนะ ลองดูคำอธิบาย"}</b>${ok?"":`<p>${HINT}</p>`}<p>${x.e}</p><button class="btn pri" onclick="nx()">${S.i+1<S.q.length?"ข้อต่อไป ➜":"สรุปด่าน ➜"}</button></div>`;
$('#fb').scrollIntoView({behavior:'smooth',block:'nearest'})}
function nx(){S.i++;S.i<S.q.length?ask():end(S.ok,S.q.length)}
function match(){S.m={s:null,x:{},d:0};S.ok=0;const I=M.map((_,i)=>i);
R(stage(["g"],"แตะคำก่อน แล้วแตะลักษณะที่ตรงกัน")+`<div class="card"><h2>จับคู่คำกับลักษณะ</h2><div class="mg"><div>${sh(I).map(i=>`<button class="btn m L" data-k="${i}" onclick="ml(${i},this)">${M[i][0]}</button>`).join('')}</div><div>${sh(I).map(i=>`<button class="btn m" data-k="${i}" onclick="mr(${i},this)">${M[i][1]}</button>`).join('')}</div></div><div id="fb"></div></div>`);bar(0)}
function ml(i,b){if(b.disabled)return;document.querySelectorAll('.L').forEach(e=>e.classList.remove('sel'));b.classList.add('sel');S.m.s=i;beep(600,.06)}
function mr(i,b){const m=S.m,s=m.s,f=$('#fb');if(b.disabled)return;
if(s===null){f.innerHTML=`<div class="fb no">👆 เลือกคำทางซ้ายก่อนนะ</div>`;return}
if(s==i){document.querySelectorAll(`[data-k="${i}"]`).forEach(e=>{e.disabled=true;e.classList.remove('sel');e.classList.add('right')});
if(!m.x[i]){S.sc+=10;S.ok++}m.d++;m.s=null;yay();fx();react('hop');hud();bar(m.d/M.length);
f.innerHTML=`<div class="fb ok">✅ <b>${M[i][0]}</b> — ${M[i][2]}${m.d==M.length?`<button class="btn pri" onclick="end(S.ok,${M.length})">สรุปด่าน ➜</button>`:""}</div>`}
else{m.x[s]=1;oops();react('wob');b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),500);
f.innerHTML=`<div class="fb no">💡 ยังไม่ใช่ ไม่เป็นไรนะ! ลองสังเกตตัวอักษรหรือรูปพยัญชนะในคำว่า “${M[s][0]}” อีกครั้ง</div>`}}
function end(ok,n){const k=S.lv,r=ok/n,st=r>=.9?3:r>=.6?2:1;S.st[k]=st;hud();bar(1);yay();fx();
R(stage(LV[k].c,"ภารกิจสำเร็จ!")+`<div class="card c"><h2>จบด่านที่ ${k+1}!</h2><div class="stars">${[0,1,2].map(i=>`<span class="${i<st?'on':''}" style="animation-delay:${i*.25}s">⭐</span>`).join('')}</div><p>ตอบถูกครั้งแรก ${ok} / ${n} ข้อ</p><div class="big">${["🥉","🥈","🥇"][st-1]}</div><p class="mut">ได้รับเหรียญรางวัล!</p><button class="btn pri" onclick="${k<3?`go(${k+1})`:'fin()'}">${k<3?"ด่านต่อไป ➜":"ดูผลรวม 🏆"}</button></div>`)}
function fin(){const mx=270,p=S.sc/mx,rk=p>=.9?["ปรมาจารย์ภาษา","🏆"]:p>=.7?["นักรบภาษาผู้กล้า","🥇"]:p>=.5?["นักสืบภาษามือโปร","🥈"]:["นักสืบภาษาฝึกหัด","🥉"];
bar(1);yay();fx();R(stage(['d','w','g'],"เยี่ยมมาก! คุณพิชิตอาณาจักรภาษาแล้ว")+`<div class="card c"><div class="big">${rk[1]}</div><h2>${rk[0]}</h2><p>คะแนนรวม <b>${S.sc}</b> / ${mx} • ดาว ⭐ ${S.st.reduce((a,b)=>a+b,0)} / 12</p><p class="big" style="font-size:36px">${LV.map((l,i)=>["🥉","🥈","🥇"][S.st[i]-1]+l.i).join(' ')}</p><button class="btn pri" onclick="start()">🔄 เล่นใหม่อีกครั้ง</button></div>`)}
start();
</script></body></html>
